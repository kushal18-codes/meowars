<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f1e5">
  <meta name="description" content="A tiny pixel-art adventure about cats on Mars.">
  <title>Meowars</title>
  <style>
    :root { --paper: #f6f1e5; --ink: #312d32; --muted: #706a66; --orange: #b74430; --mono: 'Courier New', monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px Arial, sans-serif; }
    button { color: inherit; font: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, #joystick:focus-visible { outline: 3px solid #267a80; outline-offset: 5px; }
    .page { max-width: 1000px; margin: auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { width: 30px; height: 30px; }
    h1 { font: bold 22px var(--mono); letter-spacing: -1px; margin: 0; }
    #sound { min-height: 44px; padding: 8px; border: 0; background: none; color: var(--muted); font: 11px var(--mono); }
    #sound[aria-pressed="true"] { color: #456838; }
    .game { border: 3px solid var(--ink); box-shadow: 4px 4px 0 #d7cfbe; background: #302932; }
    .objective { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 38px; padding: 8px 16px; color: #f5e5d1; font: 11px var(--mono); }
    #progress { color: #efbc60; white-space: nowrap; }
    #world { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    .dialogue { display: flex; align-items: center; gap: 12px; min-height: 84px; padding: 14px 18px; background: #fff9ec; border-top: 3px solid var(--ink); }
    #portrait { width: 42px; height: 42px; flex-shrink: 0; background: #e5d9bc; image-rendering: pixelated; }
    #speaker { color: var(--orange); font: bold 10px var(--mono); margin-bottom: 5px; }
    #dialogue-text { font-size: 13px; line-height: 1.5; margin: 0; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 20px; max-width: 390px; margin: 14px auto 0; }
    .control { width: 140px; text-align: center; }
    #joystick { position: relative; width: 140px; height: 120px; touch-action: none; user-select: none; cursor: grab; }
    #joystick:active { cursor: grabbing; }
    #joystick .back { border: 2px solid #8e8170; }
    #joystick .front { border: 2px solid var(--ink); }
    .control-label { display: block; color: var(--muted); font: 10px var(--mono); }
    .primary { min-height: 58px; padding: 14px 20px; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); background: #efbc60; font: bold 12px var(--mono); }
    .primary:hover { background: #ffd185; }
    .primary:active { box-shadow: 1px 1px 0 var(--ink); transform: translate(2px, 2px); }
    .primary:disabled { cursor: default; background: #e5dfd2; color: #6d665d; border-color: #b7ad9b; box-shadow: none; transform: none; }
    #action { width: 130px; margin: 31px 0; }
    #action-hint { min-height: 12px; }
    .keyboard-hint { color: var(--muted); font: 10px var(--mono); text-align: center; margin: 20px 0 0; }
    dialog { width: calc(100% - 40px); max-width: 360px; padding: 28px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); }
    dialog::backdrop { background: #241c2bcc; }
    dialog h2 { font: bold 22px var(--mono); margin: 0 0 14px; }
    dialog p { line-height: 1.6; margin-bottom: 22px; }
    dialog button { width: 100%; }
    @media (max-width: 600px) {
      .page { padding: 14px; }
      header { margin-bottom: 12px; }
      .objective { font-size: 10px; padding: 8px 12px; }
      .dialogue { padding: 12px; min-height: 94px; }
      #dialogue-text { font-size: 12px; }
      .controls { margin-top: 10px; }
    }
    @media (hover: none) { .keyboard-hint { display: none; } }
    @media (prefers-reduced-motion: reduce) { .primary:active { transform: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <svg viewBox="0 0 20 20" aria-hidden="true" shape-rendering="crispEdges"><path fill="#b74430" d="M2 2h5v3h6V2h5v14h-3v2H5v-2H2z"/><path fill="#f6f1e5" d="M5 8h3v3H5zm7 0h3v3h-3zM9 12h2v2H9z"/><path fill="#312d32" d="M6 8h2v2H6zm6 0h2v2h-2z"/></svg>
        <h1>MEOWARS</h1>
      </div>
      <button id="sound" aria-pressed="false">Sound off</button>
    </header>
    <section class="game" aria-label="Mars adventure">
      <div class="objective" role="status"><span id="objective">Find the power cells</span><span id="progress">0 / 3</span></div>
      <canvas id="world" width="576" height="284" aria-label="Pip and Captain Miso on Mars. Use the joystick to explore." aria-describedby="dialogue-text">Your browser needs canvas support to play.</canvas>
      <div class="dialogue">
        <canvas id="portrait" width="30" height="30" aria-hidden="true"></canvas>
        <div role="status"><div id="speaker">MISO</div><p id="dialogue-text">We made it! Find 3 power cells so we can call home.</p></div>
      </div>
    </section>
    <div class="controls" aria-label="Game controls">
      <div class="control">
        <div id="joystick" role="group" tabindex="0" aria-label="Move Pip. Drag the joystick or use WASD or arrow keys."></div>
        <span class="control-label">Drag to move</span>
      </div>
      <div class="control">
        <button class="primary" id="action" aria-keyshortcuts="E" aria-describedby="action-hint" disabled>Interact</button>
        <span class="control-label" id="action-hint">Move closer</span>
      </div>
    </div>
    <p class="keyboard-hint">Keyboard: WASD / arrows to move · E to interact</p>
  </main>
  <dialog id="ending" aria-labelledby="ending-title">
    <h2 id="ending-title">Welcome home, Pip.</h2>
    <p>Earth heard us. The flag is up. Time for the first nap on Mars.</p>
    <button class="primary" id="restart">Play again</button>
  </dialog>

      ctx.font = `bold ${size}px Courier New`;
      ctx.textAlign = 'center';

        sprite(cellSprite, cell.x - 3, cell.y - 9 + bob, { d: '#705047', w: '#fff0b0', y: '#f9c866' });
        rect(cell.x + 7, cell.y - 13 + bob, 1, 5, '#ffe9a7');
        rect(cell.x + 5, cell.y - 11 + bob, 5, 1, '#ffe9a7');
      });
      const cats = [{ ...captain, npc: true }, { ...player, npc: false }].sort((a, b) => a.y - b.y);
      cats.forEach(cat => {
        rect(cat.x - 6, cat.y, 14, 3, '#a55546');
        const hop = !cat.npc && walking && !reduceMotion ? Math.floor(time * 9) % 2 : 0;
        sprite(catSprite, cat.x - 6, cat.y - 15 - hop, cat.npc ? { ...catColors, o: '#a4a8a3', b: '#809684' } : catColors);
        if (cat.npc) { label('MISO', cat.x + 1, cat.y + 11, '#f7cfa1', 5); }
        else {
          label('PIP', cat.x + 1, cat.y - 22, '#fff0c5', 5);
          rect(cat.x, cat.y - 20, 2, 2, '#ffe2a8');
        }
      });
      if (nearby && !finished) {
        const obj = nearby.object;
        rect(obj.x - 6, obj.y - 32, 13, 10, '#332d38');
        label('!', obj.x + 1, obj.y - 25, '#ffe0a1', 7);
      }
      // Foreground stones frame the landing site.
      rock(10, 285, 3); rock(286, 290, 3); rock(571, 289, 3);
    }

    function say(name, text) {
      document.getElementById('speaker').textContent = name;
      document.getElementById('dialogue-text').textContent = text;
    }
    function playNote(frequency = 660) {
      if (!soundOn || !audioContext) return;
      const oscillator = audioContext.createOscillator();
      const volume = audioContext.createGain();
      oscillator.type = 'square'; oscillator.frequency.value = frequency;
      volume.gain.setValueAtTime(0.035, audioContext.currentTime);
      volume.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.14);
      oscillator.connect(volume); volume.connect(audioContext.destination);
      oscillator.start(); oscillator.stop(audioContext.currentTime + 0.15);
    }
    function updateObjective() {
      const count = cells.filter(cell => cell.found).length;
      document.getElementById('objective').textContent = finished ? 'Welcome home.' : repaired ? 'Plant the flag by the radio' : count === 3 ? 'Repair the radio on the right' : 'Find the power cells';
      document.getElementById('progress').textContent = finished ? '✓' : count < 3 ? `${count} / 3` : '';
    }
    function findNearby() {
      const objects = cells.filter(cell => !cell.found).map(cell => ({ object: cell, type: 'cell', text: 'Pick up cell' }));
      objects.push({ object: captain, type: 'captain', text: 'Talk to Miso' });
      if (!repaired) objects.push({ object: radio, type: 'radio', text: 'Repair radio' });
      if (repaired && !finished) objects.push({ object: flag, type: 'flag', text: 'Plant flag' });
      nearby = objects.filter(item => Math.hypot(player.x - item.object.x, player.y - item.object.y) < 23)
        .sort((a, b) => Math.hypot(player.x - a.object.x, player.y - a.object.y) - Math.hypot(player.x - b.object.x, player.y - b.object.y))[0] || null;
      const hint = nearby ? nearby.text : finished ? 'Go explore' : 'Move closer';
      if (actionHint.textContent !== hint) actionHint.textContent = hint;
      action.disabled = !nearby;
    }
    function interact() {
      if (ending.open || !nearby) return;
      const count = cells.filter(cell => cell.found).length;
      if (nearby.type === 'cell') {
        nearby.object.found = true;
        const lines = ['Found one! A bit dusty, but it works.', 'Two down. One more to go.', 'All three! Take them to the radio on the right.'];
        say('PIP', lines[count]); playNote(740 + count * 130);
      } else if (nearby.type === 'captain') {
        say('MISO', finished ? 'Good work, Pip. Now, where should we nap?' : repaired ? 'Plant our flag at the cross by the radio.' : count === 3 ? 'The radio is on the right. Time to call home!' : 'Look for the three golden sparkles. I’ll guard the snacks.');
        playNote(440);
      } else if (nearby.type === 'radio') {
        if (count < 3) { say('PIP', `The radio needs 3 cells. We have ${count}.`); }
        else { repaired = true; say('EARTH', 'We hear you, little explorers! Now plant your flag.'); playNote(980); }
      } else if (nearby.type === 'flag') {
        finished = true; stopMoving();
        say('MISO', 'One small step for a cat. One giant leap for nap-kind.');
        playNote(1200); ending.showModal();
      }
      updateObjective(); findNearby();
    }

    // The same joystick works with a mouse or a finger.
    const joystick = nipplejs.create({
      zone: document.getElementById('joystick'),
      mode: 'static',
      position: { left: '50%', top: '50%' },
      size: 90,
      color: { front: '#b74430', back: '#cbbda5' },
      restOpacity: 1,
      fadeTime: reduceMotion ? 0 : 100
    });
    joystick.on('move', event => {
      if (ending.open) return;
      const { x, y } = event.data.vector;
      const active = Math.hypot(x, y) > 0.15;
      movement.x = active ? x : 0;
      movement.y = active ? -y : 0; // Canvas y points down.
    });
    joystick.on('end', () => { movement.x = 0; movement.y = 0; });
    function stopMoving() {
      Object.keys(keys).forEach(key => keys[key] = false);
      movement.x = 0; movement.y = 0; walking = false;
      joystick.actives.forEach(stick => stick.end());
    }
    const movementKeys = ['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright'];
    window.addEventListener('keydown', event => {
      if (ending.open || event.ctrlKey || event.metaKey || event.altKey) return;
      const key = event.key.toLowerCase();
      if (movementKeys.includes(key)) { event.preventDefault(); keys[key] = true; }
      if (key === 'e' && !event.repeat) { event.preventDefault(); interact(); }
    });
    window.addEventListener('keyup', event => { keys[event.key.toLowerCase()] = false; });
    window.addEventListener('blur', stopMoving);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopMoving(); });
    window.addEventListener('resize', stopMoving);
    action.addEventListener('click', interact);
    document.getElementById('restart').addEventListener('click', () => {
      ending.close(); stopMoving(); repaired = false; finished = false;
      cells.forEach(cell => cell.found = false); player.x = 153; player.y = 230;
      say('MISO', 'We made it! Find 3 power cells so we can call home.');
      updateObjective(); findNearby();
    });
    document.getElementById('sound').addEventListener('click', async () => {
      if (!audioContext) {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) return;
        audioContext = new Audio();
      }
      try { await audioContext.resume(); } catch { return; }
      soundOn = !soundOn;
      document.getElementById('sound').setAttribute('aria-pressed', String(soundOn));
      document.getElementById('sound').textContent = soundOn ? 'Sound on' : 'Sound off';
      playNote(520);
    });

    function loop(timestamp) {
      const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      walking = false;
      if (!ending.open) {
        let dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
        let dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
        if (movement.x || movement.y) { dx = movement.x; dy = movement.y; }
        const length = Math.hypot(dx, dy);
        if (length > 0) {
          // Clamp diagonals, while keeping slow joystick movement possible.
          const scale = 65 * delta / Math.max(1, length);
          player.x = Math.max(16, Math.min(560, player.x + dx * scale));
          player.y = Math.max(164, Math.min(272, player.y + dy * scale));
          walking = true;
        }
        findNearby();
      }
      draw(timestamp / 1000);
      requestAnimationFrame(loop);
    }
    portrait.imageSmoothingEnabled = false;
    sprite(catSprite, 3, 0, { ...catColors, o: '#a4a8a3', b: '#809684' }, 2, portrait);
    ctx.imageSmoothingEnabled = false;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
